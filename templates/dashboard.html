<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Web Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-body: #060913;
            --card-bg: rgba(15, 23, 42, 0.75);
            --card-border: rgba(30, 41, 59, 0.8);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-emerald: #10b981;
            --accent-amber: #f59e0b;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-custom {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            padding: 40px;
            width: 100%;
            max-width: 600px;
        }

        .brand-title {
            font-weight: 800;
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2rem;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        .stat-row:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .stat-value {
            font-weight: 600;
            color: var(--text-primary);
        }

        .badge-dev { background-color: var(--accent-amber); color: #000; }
        .badge-prod { background-color: var(--accent-emerald); color: #000; }
        .badge-online { background-color: var(--accent-emerald); color: #fff; }

    </style>
</head>
<body>
    <div class="container d-flex justify-content-center">
        <div class="card-custom">
            <div class="brand-title">
                <i class="fas fa-shopping-cart me-2"></i> E-Commerce Web Platform
            </div>
            
            <div class="stat-row mt-4">
                <div class="stat-label"><i class="fas fa-server me-2"></i>Environment</div>
                <div class="stat-value">
                    <span class="badge {% if environment == 'PROD' %}badge-prod{% else %}badge-dev{% endif %} fs-6 px-3 py-2">
                        {{ environment }}
                    </span>
                </div>
            </div>
            
            <div class="stat-row">
                <div class="stat-label"><i class="fas fa-heartbeat me-2"></i>Status</div>
                <div class="stat-value">
                    <span class="badge badge-online fs-6 px-3 py-2"><i class="fas fa-check-circle me-1"></i>ONLINE</span>
                </div>
            </div>
            
            <div class="stat-row">
                <div class="stat-label"><i class="fas fa-microchip me-2"></i>Instance ID</div>
                <div class="stat-value text-info font-monospace">{{ instance_id }}</div>
            </div>

            <div class="stat-row">
                <div class="stat-label"><i class="fas fa-map-marker-alt me-2"></i>Availability Zone</div>
                <div class="stat-value text-info font-monospace">{{ az }}</div>
            </div>

            <div class="stat-row">
                <div class="stat-label"><i class="fas fa-network-wired me-2"></i>Hostname</div>
                <div class="stat-value text-info font-monospace">{{ hostname }}</div>
            </div>
            
            <div class="stat-row">
                <div class="stat-label"><i class="fas fa-code-branch me-2"></i>App Version</div>
                <div class="stat-value text-secondary">{{ version }}</div>
            </div>

        </div>
    </div>
</body>
</html>
